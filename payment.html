<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Payment — ZORA UID</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Inter,Arial,sans-serif;
background:
radial-gradient(circle at 50% -10%,rgba(168,85,247,.27),transparent 36%),
#060609;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
background-size:45px 45px;
mask-image:linear-gradient(to bottom,#000,transparent);
pointer-events:none;
}

.glow{
position:fixed;
width:280px;
height:280px;
border-radius:50%;
background:#a855f7;
filter:blur(120px);
opacity:.15;
top:10%;
left:50%;
transform:translateX(-50%);
animation:pulse 4s infinite;
}

@keyframes pulse{

0%,100%{
transform:translateX(-50%) scale(1);
}

50%{
transform:translateX(-50%) scale(1.3);
opacity:.23;
}

}

.box{
position:relative;
z-index:2;
width:min(440px,100%);
background:rgba(17,17,27,.75);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:22px;
backdrop-filter:blur(20px);
box-shadow:0 30px 90px rgba(0,0,0,.45);
}

.back{
display:inline-block;
color:#777;
text-decoration:none;
font-size:11px;
margin-bottom:18px;
}

.back:hover{
color:#c084fc;
}

.logo{
text-align:center;
font-size:10px;
font-weight:800;
letter-spacing:1px;
color:#c084fc;
}

h1{
text-align:center;
font-size:30px;
margin:7px 0 20px;
}

.qris{
background:#fff;
border-radius:20px;
padding:14px;
overflow:hidden;
box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.qris img{
display:block;
width:100%;
max-width:290px;
margin:auto;
}

.qris-label{
text-align:center;
color:#222;
font-size:10px;
font-weight:800;
margin-top:8px;
}

.info{
margin-top:18px;
padding:5px 15px;
border-radius:16px;
background:#09090e;
border:1px solid #282834;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:14px 0;
border-bottom:1px solid #20202a;
font-size:12px;
}

.row:last-child{
border:0;
}

.label{
color:#777;
}

.value{
font-weight:800;
text-align:right;
word-break:break-word;
}

.price{
color:#c084fc;
}

.confirm{
width:100%;
margin-top:18px;
padding:14px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#a855f7,#7c3aed);
color:#fff;
font-weight:800;
cursor:pointer;
transition:.25s;
}

.confirm:hover{
transform:translateY(-2px);
box-shadow:0 12px 35px rgba(168,85,247,.3);
}

.confirm:disabled{
opacity:.5;
cursor:not-allowed;
transform:none;
}

.info-text{
color:#666;
font-size:10px;
line-height:1.7;
text-align:center;
margin-top:14px;
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="box">

<a href="index.html" class="back">
← KEMBALI KE MARKET
</a>

<div class="logo">
ZORA UID
</div>

<h1>PAYMENT</h1>


<div class="qris">

<img
src="qris.png"
alt="QRIS">

<div class="qris-label">
SCAN QRIS UNTUK MEMBAYAR
</div>

</div>


<div class="info">

<div class="row">

<span class="label">
ID :
</span>

<span
class="value"
id="accountId">
-
</span>

</div>


<div class="row">

<span class="label">
ID PESANAN :
</span>

<span
class="value"
id="orderId">
-
</span>

</div>


<div class="row">

<span class="label">
HARGA :
</span>

<span
class="value price"
id="price">
-
</span>

</div>

</div>


<button
class="confirm"
id="confirm">

KONFIRMASI PEMBAYARAN →

</button>


<p class="info-text">

Setelah pembayaran selesai,
klik tombol di atas untuk menghubungi
admin dan kirim bukti pembayaran.

</p>

</div>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import{
getFirestore,
doc,
getDoc,
addDoc,
collection
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyBCLXYcMh6heeDchgEJwwfhOYGTPRFQnuI",
authDomain:"jual-id-ff.firebaseapp.com",
projectId:"jual-id-ff",
storageBucket:"jual-id-ff.firebasestorage.app",
messagingSenderId:"891327932016",
appId:"1:891327932016:web:1c45136d58d71a6ee6b6b5",
measurementId:"G-RB9T4EEZN2"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* MAINTENANCE */

const maintenance=
await getDoc(
doc(db,"settings","maintenance")
);

if(
maintenance.exists() &&
maintenance.data().enabled===true
){

location.replace("maintenance.html");

}


/* PRODUCT */

const productId=
new URLSearchParams(
location.search
).get("product");


if(!productId){

alert("Produk tidak ditemukan.");

location.href="index.html";

}


const productSnap=
await getDoc(
doc(db,"products",productId)
);


if(!productSnap.exists()){

alert("Produk tidak ditemukan.");

location.href="index.html";

}


const product=
productSnap.data();


if(product.status==="SOLD"){

alert("Akun ini sudah SOLD.");

location.href="index.html";

}


/* ORDER ID */

const orderId=
"ZORA-"+
Date.now()
.toString(36)
.toUpperCase();


document.getElementById("accountId")
.textContent=
product.id||"-";


document.getElementById("orderId")
.textContent=
orderId;


document.getElementById("price")
.textContent=
"Rp "+
Number(product.price||0)
.toLocaleString("id-ID");


/* CONFIRM */

document.getElementById("confirm")
.onclick=
async()=>{

const button=
document.getElementById("confirm");

button.disabled=true;

button.textContent=
"MEMPROSES...";


try{

await addDoc(
collection(db,"orders"),
{

orderId:orderId,

productId:productId,

accountId:product.id,

price:Number(
product.price||0
),

status:"MENUNGGU PEMBAYARAN",

createdAt:Date.now()

}
);


/* WHATSAPP */

const phone=
"6285783231584";


const message=
`Halo admin, saya ingin membeli akun Free Fire.

ID : ${product.id}
ID PESANAN : ${orderId}
HARGA : Rp ${Number(product.price||0).toLocaleString("id-ID")}

Saya sudah melakukan pembayaran dan akan mengirim bukti pembayaran.`;


location.href=
"https://wa.me/"+
phone+
"?text="+
encodeURIComponent(message);


}catch(error){

console.error(error);

alert(
"Gagal membuat pesanan: "+
error.message
);

button.disabled=false;

button.textContent=
"KONFIRMASI PEMBAYARAN →";

}

};

</script>

</body>
</html>
